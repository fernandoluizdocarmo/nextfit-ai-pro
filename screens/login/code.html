<body class="bg-background text-on-background min-h-screen flex flex-col kinetic-gradient selection:bg-electric-lime selection:text-slate-900">
<!-- Background Decoration -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-electric-lime/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-electric-lime/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-md py-xl">
<div class="w-full max-w-[440px] z-10">
<!-- Branding Header -->
<div class="text-center mb-lg space-y-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-electric-lime italic uppercase tracking-tighter">
                    TreinoX AI
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto opacity-80">
                    Sua evolução levada ao nível máximo pela inteligência artificial.
                </p>
</div>
<!-- Login Form Glass Card -->
<div class="glass-panel rounded-xl p-lg shadow-2xl space-y-lg border border-white/5">
<div class="space-y-base">
<h2 class="font-headline-md text-headline-md text-white">Bem-vindo</h2>
<p class="font-label-md text-label-md text-on-surface-variant">Acesse seu painel de performance</p>
</div>
<form action="#" class="space-y-md" onsubmit="return false">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase ml-1" for="email">E-mail</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-electric-lime transition-colors">mail</span>
<input class="w-full bg-surface-elevation-1 border border-slate-800 rounded-lg py-4 pl-12 pr-4 font-body-md text-body-md text-white focus:outline-none focus:border-electric-lime focus:ring-1 focus:ring-electric-lime/30 transition-all placeholder:text-surface-variant" id="email" placeholder="seu@email.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">Senha</label>
<a class="font-label-sm text-label-sm text-electric-lime/70 hover:text-electric-lime transition-colors" href="#">Esqueceu?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-electric-lime transition-colors">lock</span>
<input class="w-full bg-surface-elevation-1 border border-slate-800 rounded-lg py-4 pl-12 pr-4 font-body-md text-body-md text-white focus:outline-none focus:border-electric-lime focus:ring-1 focus:ring-electric-lime/30 transition-all placeholder:text-surface-variant" id="password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-electric-lime text-slate-900 font-label-md text-label-md py-4 rounded-lg flex items-center justify-center gap-2 hover:brightness-110 active:scale-[0.98] transition-all shadow-lg shadow-electric-lime/20" type="submit">
                        ENTRAR
                        <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-base">
<div class="h-[1px] flex-grow bg-slate-800"></div>
<span class="font-label-sm text-label-sm text-surface-variant uppercase">Ou acesse com</span>
<div class="h-[1px] flex-grow bg-slate-800"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-sm">
<button class="bg-surface-elevation-2 border border-slate-800 rounded-lg py-3 flex items-center justify-center gap-2 hover:bg-slate-800 transition-colors">
<img alt="Google" class="w-4 h-4 grayscale opacity-70 group-hover:grayscale-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC22JW2yotHH7fPiMk_Bl_R_IZQ_ZXakd_0KxdDtiWoqIBw61S245aR-LiwG_w-BivRsMxfqN8dNzNh1mYeSgwxra97LDJrZCMbt-CFO-vBOT2aajMcoZPCqLNUcLrhQpMgV1pPA8z5MTy_y-mPAvlHtUM3YzYZ97sR9ZT2By6F3O_pjz19iJcA3OLE-z1UZtuw7kb0D9IpkXMnEf-kIyck7A4QmrTu5l-ebQluaDdJ9Z9M7PToX9SvQU8Gcj4nyLl6uE8eve4MZzjR">
<span class="font-label-sm text-label-sm text-on-surface">Google</span>
</button>
<button class="bg-surface-elevation-2 border border-slate-800 rounded-lg py-3 flex items-center justify-center gap-2 hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[18px]">ios</span>
<span class="font-label-sm text-label-sm text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Footer Action -->
<div class="text-center mt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Não tem uma conta? 
                    <a class="text-electric-lime font-bold hover:underline underline-offset-4 decoration-2" href="#">Criar Nova Conta</a>
</p>
</div>

</main>
<!-- Support Image Bento (Decorative Desktop Only) -->
<div class="hidden lg:block fixed right-0 top-0 bottom-0 w-1/3 p-md">
<div class="h-full w-full relative rounded-2xl overflow-hidden border border-white/5">
<img alt="TreinoX AI Experience" class="absolute inset-0 w-full h-full object-cover" data-alt="A cinematic, high-contrast photograph of an athlete in a dimly lit, high-tech gym environment. The lighting is dramatic, with cool slate tones and sharp neon electric-lime accents reflecting off metallic weightlifting equipment. The atmosphere is intense and performance-driven, capturing the kinetic precision of a elite workout session in a futuristic sports facility." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHDrumgoHvXp5mURAqE_aIOrxrJaueKnDskwJ6gWH7fQ-vMSXQw0I5MJ-x0d6eDLTeP3xyIrTRsZlZIDey03cdaj7Wwh0JyvoToAZDcZHvZVaGm0DP6DEDNk2pZNUNTey9t_1ZB-s0eya6hx80ir4vZgYELG7bj4g_XkNNOOjOMWNu6B4D_owte8kK0WCc84pXWpag8aGCsfrklY-2mdlsO4AzjmBbKxlvvuDOyh8dhxLWk8c3-QaE21mW6lrpdDSduZp06FlZ0JW4">
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"></div>
<div class="absolute bottom-lg left-lg right-lg space-y-base">
<div class="inline-flex items-center gap-2 bg-electric-lime/20 backdrop-blur-md px-3 py-1 rounded-full border border-electric-lime/30">
<span class="w-2 h-2 rounded-full bg-electric-lime animate-pulse"></span>
<span class="text-electric-lime font-label-sm text-label-sm">LIVE AI COACHING</span>
</div>
<h3 class="font-headline-lg text-headline-lg text-white leading-tight">Supere seus limites com precisão técnica.</h3>
</div>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.style.transform = 'translateY(-2px)';
                input.parentElement.parentElement.style.transition = 'all 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.style.transform = 'translateY(0px)';
            });
        });

        // Basic password visibility toggle
        const toggleBtn = document.querySelector('button span[content="visibility"]');
        const passInput = document.getElementById('password');
        if(toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                if(passInput.type === 'password') {
                    passInput.type = 'text';
                    toggleBtn.textContent = 'visibility_off';
                } else {
                    passInput.type = 'password';
                    toggleBtn.textContent = 'visibility';
                }
            });
        }
    </script>
</body></html>
