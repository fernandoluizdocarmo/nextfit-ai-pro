<script>
        // Micro-interactions for category chips
        const chips = document.querySelectorAll('.flex-shrink-0');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
                    c.classList.add('bg-surface-container', 'text-on-surface-variant');
                });
                chip.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
                chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
            });
        });

        // Simple search filter simulation
        const searchInput = document.querySelector('input');
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('main section:last-of-type > div');
            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                if (title.includes(term)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
