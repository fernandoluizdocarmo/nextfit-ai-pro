<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neon-glow:focus-within {
            box-shadow: 0 0 15px rgba(210, 240, 0, 0.2);
        }
        .kinetic-bg {
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.95)), url('image-gym-bg');
            background-size: cover;
            background-position: center;
        }
        .hidden-screen {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Login Screen -->
<main class="kinetic-bg min-h-screen flex flex-col items-center justify-center px-margin-mobile relative" id="login-screen">
<!-- Visual Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-container via-secondary-container to-primary-container"></div>
<div class="w-full max-w-[400px] flex flex-col items-center">
<!-- Brand Identity -->
<div class="mb-lg text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile italic font-black text-primary-container tracking-tighter mb-base">FORGE</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant">ELITE PERFORMANCE SYSTEM</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-md" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-base group">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-base">EMAIL</label>
<div class="relative neon-glow">
<input class="w-full bg-surface-container border-none border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface py-md px-sm transition-all duration-300 placeholder:text-surface-variant" placeholder="atleta@forge.com" type="email"/>
</div>
</div>
<div class="flex flex-col space-y-base group">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-base">PASSWORD</label>
<div class="relative neon-glow">
<input class="w-full bg-surface-container border-none border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface py-md px-sm transition-all duration-300 placeholder:text-surface-variant" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md rounded-none uppercase tracking-widest active:scale-95 transition-transform mt-lg">
                    ENTRAR
                </button>
</form>
<div class="mt-xl text-center">
<button class="font-label-caps text-label-caps text-primary-fixed-dim hover:text-primary transition-colors border-b border-primary-fixed-dim border-dashed" onclick="toggleScreens()">
                    CRIAR NOVA CONTA
                </button>
</div>
</div>
<!-- Atmospheric Background Image -->
<div class="hidden">
<img data-alt="A cinematic, high-contrast photograph of a dimly lit professional weightlifting gym at night. Intense neon lime light strips reflect off the polished chrome of heavy-duty squat racks and rows of black dumbbells. The atmosphere is moody and focused, with a subtle haze in the air highlighting the industrial textures of concrete floors and steel equipment. The visual style is aggressive yet clean, embodying the peak performance and energy of the Forge brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcsNJADfkTwCsp8BYMdQQCnfmi7hwdpuQMCR0oAAH1jLeEjqVsvyGCUj4BKMfkqvNGoyGVMe0YpKb3OjcAKycg_czi0TH1ssBvtP7spxQvFOZYsMIy_Jw4Y7SYMsrO5oZxgFi0oU5zy9foSedZiwsHS9CNviLvbF5aKuVh6e6BIMhw_CDNWDK1JbzMqT3ap8V9vrKuyJCEy_Fo8GpkKVIsTN26mRrBsJbZhp0BJ8BBCjuua6BKooGySHwZVhQK-gXcci4hx2aHLSv7"/>
</div>
</main>
<!-- Registration Screen -->
<main class="hidden-screen min-h-screen bg-background flex flex-col items-center py-xl px-margin-mobile overflow-y-auto" id="register-screen">
<div class="w-full max-w-[440px]">
<!-- Header Section -->
<div class="mb-lg flex items-center justify-between">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile italic font-black text-primary tracking-tighter">JOIN THE FORGE</h2>
<p class="font-label-caps text-label-caps text-on-surface-variant">PERSONALIZE SEU PERFIL</p>
</div>
<button class="p-sm bg-surface-container-high rounded-lg text-on-surface active:scale-90 transition-all" onclick="toggleScreens()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Registration Form -->
<form class="space-y-md" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">NOME COMPLETO</label>
<input class="w-full bg-surface-container border-none border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface py-md px-sm transition-all" placeholder="Seu nome" type="text"/>
</div>
<div class="flex flex-col space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">EMAIL</label>
<input class="w-full bg-surface-container border-none border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface py-md px-sm transition-all" placeholder="atleta@forge.com" type="email"/>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">SENHA</label>
<input class="w-full bg-surface-container border-none border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface py-md px-sm transition-all" placeholder="••••••••" type="password"/>
</div>
<div class="flex flex-col space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">IDADE</label>
<input class="w-full bg-surface-container border-none border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface py-md px-sm transition-all" placeholder="25" type="number"/>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">PESO (KG)</label>
<input class="w-full bg-surface-container border-none border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface py-md px-sm transition-all" placeholder="80" type="number"/>
</div>
<div class="flex flex-col space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">ALTURA (CM)</label>
<input class="w-full bg-surface-container border-none border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface py-md px-sm transition-all" placeholder="185" type="number"/>
</div>
</div>
<div class="pt-lg">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md rounded-none uppercase tracking-widest active:scale-95 transition-transform flex items-center justify-center gap-sm">
                        FORJAR CONTA
                        <span class="material-symbols-outlined">bolt</span>
</button>
</div>
<p class="text-center font-body-md text-on-surface-variant text-[14px] mt-md">
                    Ao se registrar, você aceita nossos <span class="text-primary-fixed-dim underline">Termos de Serviço</span>.
                </p>
</form>
</div>
</main>
<script>
        function toggleScreens() {
            const login = document.getElementById('login-screen');
            const register = document.getElementById('register-screen');
            
            if (login.classList.contains('hidden-screen')) {
                login.classList.remove('hidden-screen');
                register.classList.add('hidden-screen');
            } else {
                login.classList.add('hidden-screen');
                register.classList.remove('hidden-screen');
            }
        }

        // Add subtle parallax/hover effect to the kinetic background
        document.addEventListener('mousemove', (e) => {
            const loginScreen = document.getElementById('login-screen');
            if (!loginScreen.classList.contains('hidden-screen')) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                loginScreen.style.backgroundPosition = `calc(50% + ${moveX}px) calc(50% + ${moveY}px)`;
            }
        });
    </script>
</body></html>
