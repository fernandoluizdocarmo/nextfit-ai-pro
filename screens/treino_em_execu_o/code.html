<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;family=Space+Mono:wght@400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Space+Mono:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .timer-ring-container {
            position: relative;
            width: 280px;
            height: 280px;
        }
        .timer-svg {
            transform: rotate(-90deg);
        }
        .timer-circle-bg {
            stroke: #2C2C2C;
            stroke-width: 8;
            fill: transparent;
        }
        .timer-circle-progress {
            stroke: #d2f000;
            stroke-width: 8;
            stroke-linecap: round;
            fill: transparent;
            stroke-dasharray: 816.8; /* 2 * PI * 130 */
            stroke-dashoffset: 200;
            transition: stroke-dashoffset 1s linear;
        }
        .bg-noise {
            background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
            opacity: 0.05;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "on-secondary-fixed-variant": "#004493",
                        "surface-dim": "#131313",
                        "on-primary-fixed": "#191e00",
                        "on-primary": "#2c3400",
                        "on-secondary": "#002e69",
                        "on-secondary-fixed": "#001a41",
                        "inverse-on-surface": "#313030",
                        "tertiary-container": "#ffdad5",
                        "inverse-surface": "#e5e2e1",
                        "on-primary-fixed-variant": "#414c00",
                        "surface-container-lowest": "#0e0e0e",
                        "on-tertiary-fixed-variant": "#930005",
                        "outline-variant": "#454932",
                        "surface-bright": "#393939",
                        "tertiary": "#ffffff",
                        "inverse-primary": "#576500",
                        "on-tertiary": "#690003",
                        "on-background": "#e5e2e1",
                        "on-surface-variant": "#c6c9ab",
                        "on-surface": "#e5e2e1",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#b8d300",
                        "on-tertiary-container": "#ca0a0f",
                        "error-container": "#93000a",
                        "on-secondary-container": "#00285c",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-high": "#2a2a2a",
                        "secondary-fixed": "#d8e2ff",
                        "primary-container": "#d2f000",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "background": "#131313",
                        "on-tertiary-fixed": "#410001",
                        "surface-container-highest": "#353534",
                        "secondary-container": "#4b8eff",
                        "primary": "#ffffff",
                        "surface-container": "#201f1f",
                        "on-error": "#690005",
                        "surface": "#131313",
                        "secondary": "#adc6ff",
                        "surface-tint": "#b8d300",
                        "primary-fixed": "#d2f000",
                        "on-primary-container": "#5d6b00",
                        "outline": "#909378",
                        "surface-variant": "#353534",
                        "tertiary-fixed": "#ffdad5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "sm": "16px",
                        "xl": "64px",
                        "margin-desktop": "48px",
                        "lg": "40px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "md": "24px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "label-caps": ["Space Mono"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "stats-xl": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "800"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "900"}],
                        "stats-xl": ["64px", {"lineHeight": "1.0", "fontWeight": "900"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
<div class="fixed inset-0 bg-noise pointer-events-none"></div>
<!-- Navigation suppression: TopAppBar used only for 'Exit' context as it's a focused journey -->
<header class="flex justify-between items-center w-full px-margin-mobile py-xs bg-surface border-b border-outline-variant z-50">
<button aria-label="Cancel Workout" class="active:scale-95 transition-transform hover:opacity-80 flex items-center gap-xs">
<span class="material-symbols-outlined text-primary">close</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">END WORKOUT</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile italic font-black text-primary tracking-tighter">FORGE</h1>
<div class="w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">more_vert</span>
</div>
</header>
<main class="min-h-[calc(100vh-60px)] flex flex-col items-center justify-between py-md px-margin-mobile relative z-10">
<!-- Header Section -->
<section class="w-full text-center space-y-base">
<p class="font-label-caps text-label-caps text-primary-fixed tracking-[0.2em]">LEGS • POWER</p>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg italic uppercase tracking-tight">Barbell Squats</h2>
</section>
<!-- Visual / Animation Placeholder -->
<section class="w-full max-w-md aspect-video relative rounded-xl overflow-hidden bg-surface-container-high border border-outline-variant group">
<img class="w-full h-full object-cover grayscale brightness-75 transition-all duration-700 group-hover:scale-105" data-alt="A professional fitness demonstration of a person performing a barbell back squat in a high-intensity dark gym environment. The lighting is cinematic, utilizing high-contrast key lights to accentuate muscle definition and form. The aesthetic is clean and modern, focusing on the precision of the movement against a void-like black background with subtle neon lime accents reflecting on the chrome barbell. The mood is concentrated and powerful." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMK8hCAOzs4nxeg30JXwwaf5M5J3KTcBzkG5-Rh98u3twblBaroEhivR0lu_4VMk-t8xaykcQdiuJc4_1kZdx3p_pC7P4kMcA609YKa4I-5o8gUlClBjHc2Oo92GuFVmRM_nWnXWyxF0n7qpYBeP79V4B0vCjhsB08pFLoMA7S241ZJTrtMnCwofysxSf0MFwAn8k5iYKdStns_DaFS9I5q_e8HO0gqGA8KD3gZZ5vgG4oKHJE60Db9ZebzK2aATPazTD5-4hTxE9M"/>
<div class="absolute inset-0 flex items-center justify-center bg-black/30 backdrop-blur-[2px]">
<div class="w-16 h-16 rounded-full border-2 border-primary-fixed flex items-center justify-center cursor-pointer hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary-fixed text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
</div>
<div class="absolute bottom-sm left-sm bg-background/80 px-xs py-1 rounded">
<span class="font-label-caps text-[10px] text-on-surface">VIDEO GUIDE</span>
</div>
</section>
<!-- Timer & Set Info Section -->
<section class="flex flex-col items-center space-y-md">
<div class="timer-ring-container flex items-center justify-center">
<svg class="timer-svg w-full h-full" viewbox="0 0 300 300">
<circle class="timer-circle-bg" cx="150" cy="150" r="130"></circle>
<circle class="timer-circle-progress" cx="150" cy="150" id="progressCircle" r="130"></circle>
</svg>
<div class="absolute flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">REPS</span>
<span class="font-stats-xl text-stats-xl leading-none">12</span>
<span class="font-headline-md text-headline-md text-primary-fixed mt-xs">SET 1 <span class="text-on-surface-variant/50 font-normal">OF 4</span></span>
</div>
</div>
<!-- Controls -->
<div class="flex items-center gap-xl">
<button class="w-14 h-14 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant active:scale-90 transition-all">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<button class="w-20 h-20 rounded-full bg-surface-container-highest flex items-center justify-center text-primary active:scale-90 transition-all border-2 border-outline" id="toggleTimer">
<span class="material-symbols-outlined text-3xl">pause</span>
</button>
<button class="w-14 h-14 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant active:scale-90 transition-all">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</section>
<!-- CTA Action -->
<section class="w-full max-w-md pb-xs">
<button class="w-full bg-primary-fixed text-on-primary-fixed font-headline-md text-headline-md py-md rounded-xl active:scale-[0.98] transition-all flex items-center justify-center gap-xs shadow-[0_0_20px_rgba(210,240,0,0.2)]">
                COMPLETE SET
                <span class="material-symbols-outlined">check_circle</span>
</button>
<div class="mt-sm flex justify-between px-xs">
<div class="flex flex-col">
<span class="font-label-caps text-[10px] text-on-surface-variant">LAST WEIGHT</span>
<span class="font-headline-md text-[18px]">225 LBS</span>
</div>
<div class="flex flex-col text-right">
<span class="font-label-caps text-[10px] text-on-surface-variant">EST. REST</span>
<span class="font-headline-md text-[18px]">90 SEC</span>
</div>
</div>
</section>
</main>
<script>
        // Micro-interactions for the timer
        let progress = 200;
        const circle = document.getElementById('progressCircle');
        const toggleBtn = document.getElementById('toggleTimer');
        let isPaused = false;

        setInterval(() => {
            if (!isPaused) {
                progress = (progress + 1) % 816.8;
                circle.style.strokeDashoffset = progress;
            }
        }, 100);

        toggleBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            const icon = toggleBtn.querySelector('.material-symbols-outlined');
            icon.textContent = isPaused ? 'play_arrow' : 'pause';
            toggleBtn.classList.toggle('border-primary-fixed', !isPaused);
        });

        // Add active scaling to all buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>
</body></html>
