  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    
    .progress-ring-circle {
      transition: stroke-dashoffset 0.35s;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    
    .timer-ring-container {
      position: relative;
      width: 280px;
      height: 280px;
    }
    
    .timer-svg {
      transform: rotate(-90deg);
    }
    
    .timer-circle-bg {
      stroke: #2C2C2C;
      stroke-width: 8;
      fill: transparent;
    }
    
    .timer-circle-progress {
      stroke: #d2f000;
      stroke-width: 8;
      stroke-linecap: round;
      fill: transparent;
      stroke-dasharray: 816.8;
      stroke-dashoffset: 200;
      transition: stroke-dashoffset 1s linear;
    }
    
    .bg-noise {
      background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
      opacity: 0.05;
    }
    
    .neon-glow:focus-within {
      box-shadow: 0 0 15px rgba(210, 240, 0, 0.2);
    }
    
    .kinetic-bg {
      background: linear-gradient(rgba(18, 18, 28, 0.85), rgba(18, 18, 28, 0.95)), url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAABZJREFUeNpi2L9//38gYGAEEWAADPUCeKl44+gAAAAASUVORK5CYII=');

      background-position: center;
    }
    
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    body {
      min-height: max(884px, 100dvh);
    }
